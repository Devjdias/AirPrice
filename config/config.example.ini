# Modelo de configuração do AirPrice.
# Copie este arquivo para config/config.ini e preencha apenas o que for usar.
# config.ini nunca deve ser versionado (já está no .gitignore).

[GSHEETS]
# Opcional. Deixe em branco para usar apenas o Excel local em DADOS_BRUTOS/.
# arquivo_credenciais: caminho para o JSON da Service Account do Google Cloud.
# id_planilha: ID da planilha (trecho da URL entre /d/ e /edit).
# nome_aba: aba onde as linhas serão acrescentadas (criada automaticamente se não existir).
arquivo_credenciais =
id_planilha =
nome_aba = Dados

[ANTIDETECT]
# humanize: liga esperas humanizadas (sleep_interrompivel) entre ações no navegador.
# save_html: salva o HTML bruto da página em LOGS/ como .html.gz (removido após conferência de MD5).
# screenshot: salva screenshot em LOGS/ quando uma tentativa falha ou não retorna dados.
humanize = True
save_html = False
screenshot = False

[PROXY]
# enabled: liga o uso de proxy nas coletas.
# list: lista de proxies separados por vírgula, no formato host:porta.
enabled = False
list =
